[package]
name = "raydio"
version = "0.2.2"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "A lightweight YouTube-first Discord music bot powered by Crust, Mantle, and Oto"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures-util = "0.3.34"
rand = "0.9.5"
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "test-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-native-roots", "zlib"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-native-roots"] }
twilight-model = "0.17.1"
url = "2.5.8"
crust = { git = "https://github.com/rayan6ms/crust", rev = "ebfc1779a0548491f8b247820b67f3c7163f1e42" }
crust-server = { git = "https://github.com/rayan6ms/crust", rev = "ebfc1779a0548491f8b247820b67f3c7163f1e42" }
crust-mantle-adapter = { git = "https://github.com/rayan6ms/crust", rev = "ebfc1779a0548491f8b247820b67f3c7163f1e42" }
crust-oto-adapter = { git = "https://github.com/rayan6ms/crust", rev = "ebfc1779a0548491f8b247820b67f3c7163f1e42" }
mantle-media = { git = "https://github.com/rayan6ms/mantle", rev = "4bdb224ca6b32b6e6640c8cd7a4c7d72da114a52" }

[patch.crates-io]
openmls_rust_crypto = { git = "https://github.com/rayan6ms/oto", rev = "62d2fc87e5dc239695a8b86a7372a4edc1caa933" }


[profile.dev]
debug = 0

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = "s"

# Keep the complete release graph size-optimized so dependency code does not
# dominate resident executable pages on small Oracle instances.

[dev-dependencies]
crust-testkit = { git = "https://github.com/rayan6ms/crust", rev = "ebfc1779a0548491f8b247820b67f3c7163f1e42" }
axum = { version = "0.8.4", features = ["ws"] }
oto = { git = "https://github.com/rayan6ms/oto", rev = "62d2fc87e5dc239695a8b86a7372a4edc1caa933" }
mantle-core = { git = "https://github.com/rayan6ms/mantle", rev = "4bdb224ca6b32b6e6640c8cd7a4c7d72da114a52" }
mantle-media = { git = "https://github.com/rayan6ms/mantle", rev = "4bdb224ca6b32b6e6640c8cd7a4c7d72da114a52" }
