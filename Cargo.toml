[package]
name = "raydio"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "A lightweight YouTube-first Discord music bot powered by Crust, Mantle, and Oto"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures-util = "0.3.34"
rand = "0.9.5"
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "test-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-native-roots", "zlib"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-native-roots"] }
twilight-model = "0.17.1"
url = "2.5.8"
crust = { path = "../crust/crates/crust" }
crust-server = { path = "../crust/crates/crust-server" }
crust-mantle-adapter = { path = "../crust/crates/crust-mantle-adapter" }
crust-oto-adapter = { path = "../crust/crates/crust-oto-adapter" }

[patch.crates-io]
openmls_rust_crypto = { path = "../oto/vendor/openmls_rust_crypto" }

[patch."https://github.com/rayan6ms/mantle"]
mantle-audio = { path = "../mantle/crates/mantle-audio" }
mantle-core = { path = "../mantle/crates/mantle-core" }
mantle-media = { path = "../mantle/crates/mantle-media" }

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

# Most idle resident pages are bot/control code. Keep codec/voice dependencies
# at the default speed setting while measuring a smaller control executable.
[profile.release.package.raydio]
opt-level = "s"

[dev-dependencies]
crust-testkit = { path = "../crust/crates/crust-testkit" }
axum = { version = "0.8.4", features = ["ws"] }
oto = { path = "../oto/crates/oto" }
mantle-core = { path = "../mantle/crates/mantle-core" }
mantle-media = { path = "../mantle/crates/mantle-media" }
