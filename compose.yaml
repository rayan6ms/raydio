services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine@sha256:96be2be7ee50d35a9bd42c8c7b99e2a4b741f09123066c1ebb9e014dd7db204d
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: "${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    expose:
      - "2333"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --spider -T 3
          --header="Authorization: $${LAVALINK_SERVER_PASSWORD}"
          http://127.0.0.1:2333/version
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - raydio

networks:
  raydio:
    driver: bridge
