services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: raydio-bot:0.1.0
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: "${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_PASSWORD: "${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}"
      LAVALINK_SECURE: "false"
      DEFAULT_VOLUME: "${DEFAULT_VOLUME:-70}"
      IDLE_DISCONNECT_SECONDS: "${IDLE_DISCONNECT_SECONDS:-120}"
      ALONE_DISCONNECT_SECONDS: "${ALONE_DISCONNECT_SECONDS:-120}"
      MAX_PLAYLIST_TRACKS: "${MAX_PLAYLIST_TRACKS:-250}"
      MAX_QUEUE_TRACKS: "${MAX_QUEUE_TRACKS:-1000}"
      MAX_PENDING_PLAY_REQUESTS: "${MAX_PENDING_PLAY_REQUESTS:-10}"
      MAX_TRACK_DURATION_HOURS: "${MAX_TRACK_DURATION_HOURS:-3}"
      ALLOW_LIVESTREAMS: "${ALLOW_LIVESTREAMS:-false}"
    depends_on:
      lavalink:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    networks:
      - raydio

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine@sha256:96be2be7ee50d35a9bd42c8c7b99e2a4b741f09123066c1ebb9e014dd7db204d
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: "${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    expose:
      - "2333"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --spider -T 3
          --header="Authorization: $${LAVALINK_SERVER_PASSWORD}"
          http://127.0.0.1:2333/version
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - raydio

networks:
  raydio:
    driver: bridge
